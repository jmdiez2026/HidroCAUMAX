# Publicación puntual del código y ZIP verificados de la versión 1.2.11.
# Se ejecuta desde main, permitido por el entorno github-pages existente.
# El workflow general release.yml conserva sus disparadores habituales.
name: Publicar HidroCAUMAX 1.2.11 verificada

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1.2.11.yml'

permissions:
  contents: read

concurrency:
  group: hidrocaumax-release-pages
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jmdiez2026/HidroCAUMAX' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código verificado de 1.2.11
        uses: actions/checkout@v7
        with:
          ref: adba77511132ce0267c44d6016651f66b6d9fa0c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar empaquetado, identidad y XML
        run: python -m unittest discover -s tests -p test_release_packaging.py -v
      - name: Validar empaquetador del runtime TauDEM
        run: python -m unittest discover -s tests -p test_taudem_bundle.py -v
      - name: Verificar integridad del runtime TauDEM versionado
        run: python scripts/prepare_taudem_bundle.py --verify src/caumax_consulta/vendor/taudem-5.5.0-win64.zip
      - name: Construir publicación
        env:
          RELEASE_TAG: v1.2.11
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_release.py --output dist --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Crear o verificar la etiqueta de la versión preparada
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISHER_COMMIT: ${{ github.workflow_sha }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python - <<'PY'
          import os
          from pathlib import Path
          from publish_release import api, run, validate_bundle

          repository = os.environ['RELEASE_REPOSITORY']
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('Esta publicación debe ejecutarse desde main.')
          expected_commit = 'adba77511132ce0267c44d6016651f66b6d9fa0c'
          expected_tag = 'v1.2.11'
          expected_digest = '29dc4d730509ae15de9b7dfaad1a0ebec77ed67c6a2fa94b9ffe7c5f356e8517'
          if repository != 'jmdiez2026/HidroCAUMAX':
              raise RuntimeError('La publicación preparada pertenece a otro repositorio.')
          if run(['git', 'rev-parse', 'HEAD']).stdout.strip() != expected_commit:
              raise RuntimeError('El checkout no coincide con el código verificado.')
          workflow_commit = os.environ['PUBLISHER_COMMIT']
          run(['git', 'merge-base', '--is-ancestor', expected_commit, workflow_commit])
          changed = run(['git', 'diff', '--name-only', expected_commit, workflow_commit]).stdout.splitlines()
          if changed != ['.github/workflows/publish-1.2.11.yml']:
              raise RuntimeError('La preparación de publicación modifica archivos fuera del workflow.')
          manifest, _ = validate_bundle(Path('dist'), repository)
          if manifest['tag'] != expected_tag or manifest['version'] != '1.2.11':
              raise RuntimeError('La versión no coincide con la publicación preparada.')
          if manifest['sha256'] != expected_digest:
              raise RuntimeError('El instalable no coincide con el ZIP verificado.')
          endpoint = f'repos/{repository}/git/ref/tags/{expected_tag}'
          reference = api(endpoint, missing_ok=True)
          if reference is None:
              run(['gh', 'api', '--method', 'POST', f'repos/{repository}/git/refs',
                   '-f', f'ref=refs/tags/{expected_tag}', '-f', f'sha={expected_commit}'])
              reference = api(endpoint)
          target = reference['object']
          while target['type'] == 'tag':
              target = api(f'repos/{repository}/git/tags/{target["sha"]}')['object']
          if target['type'] != 'commit' or target['sha'] != expected_commit:
              raise RuntimeError('La etiqueta existente apunta a otro commit; no se sustituye.')
          print('Etiqueta y paquete verificados para HidroCAUMAX 1.2.11.')
          PY
      - name: Preparar publicador de la revisión del workflow
        env:
          PUBLISHER_COMMIT: ${{ github.workflow_sha }}
        run: |
          # El complemento y build_release siguen siendo los de la etiqueta.
          # El publicador corregido permite completar publicaciones existentes.
          git show "$PUBLISHER_COMMIT:scripts/publish_release.py" > "$RUNNER_TEMP/hidrocaumax-publish-release.py"
      - name: Crear o completar Release sin sustituir archivos existentes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/scripts" python "$RUNNER_TEMP/hidrocaumax-publish-release.py" --output dist --repository "$RELEASE_REPOSITORY"
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir índice QGIS
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar disponibilidad del índice QGIS
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Pages lists artifacts through the API after upload. Wait for this
          # exact attempt; a retry must never select an older namesake.
          for attempt in {1..12}; do
            count=$(gh api "repos/$PAGES_REPOSITORY/actions/runs/$PAGES_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "El índice QGIS de este intento está duplicado; se detiene el despliegue." >&2
              exit 1
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "El índice QGIS no está disponible en la API tras la espera; se puede reintentar." >&2
          exit 1
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
