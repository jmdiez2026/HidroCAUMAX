name: Validar correcciones de resolución mejorada

on:
  push:
    branches:
      - fix/1.0.17-retencion-d8-export
      - fix/1.0.18-fine-rational-and-pink-network
      - fix/1.0.19-restore-basin-selector-outlet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis Python
        run: python3 -m compileall -q src/caumax_consulta tests
      - name: Instalar PyQGIS, Qt5 y GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-qgis python3-gdal
      - name: Comprobar comportamiento en PyQGIS
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          failure=0
          for pattern in 'test_active_basin_layers.py' 'test_basin_hydrology_dialog.py' 'test_dialog_layout.py' 'test_native_query_cleanup.py' 'test_manual_outlet_dialog_integration.py' 'test_rational_baseline_select.py' 'test_rational_basin_dialog.py' 'test_rational_persistence.py' 'test_regression_outlet_boundary.py' 'test_regression_resolution_save.py' 'test_terrain.py' 'test_watershed_controller.py' 'test_caumax_bridge.py' 'test_native_layers_view.py' 'test_rational_inputs.py' 'test_rational_custom_grid.py' 'test_rational_basin.py' 'test_hydro_export.py' 'test_boundary_layers.py' 'test_drainage_layers.py' 'test_drainage_dialog.py' 'test_taudem_engine.py' 'test_taudem_runtime.py' 'test_native_toolbar.py' 'test_rational_layers_panel.py' 'test_resolution_controller.py' 'test_clean_layers_ui.py' 'test_generated_cleanup.py' 'test_release_packaging.py'; do
            echo "::group::Pruebas $pattern"
            /usr/bin/python3 -m unittest discover -s tests -p "$pattern" -v || failure=1
            echo "::endgroup::"
          done
          exit "$failure"
