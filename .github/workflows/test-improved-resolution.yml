name: Validar correcciones de resolución mejorada

on:
  push:
    branches:
      - main
      - mejora-icono-cargar-capas-caumax-v31
      - fix/1.0.17-retencion-d8-export
      - fix/1.0.18-fine-rational-and-pink-network
      - fix/1.0.19-restore-basin-selector-outlet
      - fix/1.0.20-independent-native-map-queries
      - fix/1.0.21-pink-network-and-500m-boundary
      - fix/1.0.22-rational-configured-grids
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis Python
        run: python3 -m compileall -q src/caumax_consulta tests
      - name: Instalar PyQGIS, Qt5 y GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-qgis python3-gdal python3-pypdf
      - name: Cotejar calculador CAUMAX original de referencia
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caumax-original"
          curl -fsSL --retry 2 --max-time 45 \
            https://raw.githubusercontent.com/samuelsl27/Caumax_v30_QGIS_4/5d8e5ddd92e552d5fba627fda0836ef0255e0be7/desarrollo/caumax/basincalculator.py \
            -o "$RUNNER_TEMP/caumax-original/basincalculator.py"
          test "$(git hash-object "$RUNNER_TEMP/caumax-original/basincalculator.py")" = 6062039ea32f172b3f6e11818d957223edf384e9
      - name: Comprobar comportamiento en PyQGIS
        env:
          HIDROCAUMAX_CAUMAX_SOURCE: ${{ runner.temp }}/caumax-original
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          failure=0
          for pattern in 'test_active_basin_layers.py' 'test_course_layers.py' 'test_course_flow_profile.py' 'test_legacy_course_areas.py' 'test_hypsometric_selection.py' 'test_po_clip.py' 'test_pd_clip.py' 'test_reports.py' 'test_session_store.py' 'test_smooth_export.py' 'test_native_caumax_toolbar_shortcut.py' 'test_closure_layers.py' 'test_basin_archive.py' 'test_basin_hydrology.py' 'test_basin_hydrology_controller.py' 'test_basin_hydrology_dialog.py' 'test_basin_hydrology_widget.py' 'test_dialog_layout.py' 'test_native_query_cleanup.py' 'test_manual_outlet.py' 'test_manual_outlet_dialog_integration.py' 'test_outlet_selection.py' 'test_refinement_snap.py' 'test_rational_baseline_select.py' 'test_rational_layers_bridge.py' 'test_rational_layers_controller.py' 'test_native_decimal.py' 'test_rational_basin_dialog.py' 'test_rational_persistence.py' 'test_regression_outlet_boundary.py' 'test_regression_resolution_save.py' 'test_terrain.py' 'test_watershed_controller.py' 'test_caumax_bridge.py' 'test_native_layers_view.py' 'test_rational_inputs.py' 'test_rational_grid_validation.py' 'test_rational_custom_grid.py' 'test_rational_basin.py' 'test_hydro_export.py' 'test_boundary_layers.py' 'test_drainage_layers.py' 'test_drainage_dialog.py' 'test_taudem_engine.py' 'test_taudem_runtime.py' 'test_native_toolbar.py' 'test_rational_layers_panel.py' 'test_resolution_controller.py' 'test_clean_layers_ui.py' 'test_generated_cleanup.py' 'test_release_packaging.py' 'test_future_qgis_updates.py'; do
            echo "::group::Pruebas $pattern"
            if timeout --signal=TERM --kill-after=5s 150s /usr/bin/python3 -m unittest discover -s tests -p "$pattern" -v; then
              echo "PASS: $pattern"
            else
              status=$?
              echo "::error::FAIL/TIMEOUT $pattern (exit code $status)"
              failure=1
            fi
            echo "::endgroup::"
          done
          exit "$failure"
