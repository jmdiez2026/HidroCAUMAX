# One-time publication bootstrap for the v1.0 public version reset.
# Publishes only when this exact main revision carries the matching metadata.
name: Preparar y publicar HidroCAUMAX v1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'jmdiez2026/HidroCAUMAX' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener el commit exacto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fijar etiqueta v1.0 y lanzar el empaquetado y pruebas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sed -n 's/^version=//p' src/caumax_consulta/metadata.txt)" = "1.0.0"
          test "$(sed -n 's/^name=//p' src/caumax_consulta/metadata.txt)" = "HidroCAUMAX v1.0"
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "main cambió; se rechaza etiquetar código diferente." >&2
            exit 1
          fi
          # Missing refs can yield a JSON null on some API wrappers.
          # Only a literal 40-hex SHA is evidence that the tag exists.
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/v1.0" --jq '.object.sha // ""' 2>/dev/null || true)"
          if ! [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
            existing=""
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "La etiqueta v1.0 existe y señala otro commit; no se altera." >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f 'ref=refs/tags/v1.0' -f "sha=$GITHUB_SHA"
          fi
          gh workflow run release.yml --repo "$GH_REPO" --ref main -f tag=v1.0
          echo "Publicación v1.0 iniciada: el workflow comprueba ZIP y EXE en Windows antes de distribuir."
