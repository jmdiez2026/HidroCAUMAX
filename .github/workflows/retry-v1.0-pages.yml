# Once-only retry of the verified v1.0 release's Pages deployment.
# No files or tags are replaced; the existing tag fixes the same verified source.
name: Reintentar índice QGIS v1.0 verificado

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retry-v1.0-pages.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'jmdiez2026/HidroCAUMAX' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validar etiqueta y binarios ya publicados y relanzar el workflow normal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GH_REPO/git/ref/tags/v1.0" --jq '.object.sha')"
          test "$sha" = "67070bf638a742c311266fc69065842a95483327"
          gh api "repos/$GH_REPO/releases/tags/v1.0" --jq '.tag_name' | grep -Fx 'v1.0'
          test -n "$(gh api "repos/$GH_REPO/releases/tags/v1.0" --jq '.assets[] | select(.name == "HidroCAUMAX_v1_0_0.zip") | .id')"
          test -n "$(gh api "repos/$GH_REPO/releases/tags/v1.0" --jq '.assets[] | select(.name == "HidroCAUMAX_v1_0_0_Setup.exe") | .id')"
          gh workflow run release.yml --repo "$GH_REPO" --ref main -f tag=v1.0
          echo "Reintento del despliegue QGIS iniciado; se reutilizan los assets verificados."
