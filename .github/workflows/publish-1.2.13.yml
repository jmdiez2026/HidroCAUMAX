# Publicación puntual del código y ZIP verificados de la versión 1.2.13.
# Este archivo se añade después del commit fuente; solo él puede diferir.
# El EXE se compila una vez y se ejecuta en Windows antes de publicar sus bytes.
name: Publicar HidroCAUMAX 1.2.13 verificada

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1.2.13.yml'

permissions:
  contents: read

concurrency:
  group: hidrocaumax-release-pages
  cancel-in-progress: false

env:
  VERIFIED_SOURCE_SHA: 5e8b491a812b7a290e243cefd1f80ac179855a54
  VERIFIED_ZIP_DIGEST: 70710547afa435ca41849a4cec97d495e6a434d2891251f1281b08d8b1c1478c

jobs:
  build:
    if: github.repository == 'jmdiez2026/HidroCAUMAX' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      has_installer: ${{ steps.source.outputs.has_installer }}
    steps:
      - name: Obtener exactamente el código solicitado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFIED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fijar fuente y modalidad de publicación
        id: source
        env:
          RELEASE_TAG: v1.2.13
          HAS_INSTALLER_BUILDER: ${{ hashFiles('scripts/build_windows_installer.py') != '' }}
          HAS_WINDOWS_SMOKE: ${{ hashFiles('tests/windows_installer_smoke.ps1') != '' }}
        run: |
          # Las etiquetas históricas sin ambos archivos mantienen su ZIP.
          # Una integración incompleta nunca publica un EXE sin prueba Windows.
          if [ "$HAS_INSTALLER_BUILDER" != "$HAS_WINDOWS_SMOKE" ]; then
            echo 'El constructor EXE y su prueba Windows deben estar versionados juntos.' >&2
            exit 1
          fi
          if [ "$HAS_INSTALLER_BUILDER" != 'true' ]; then
            echo 'La versión 1.2.13 requiere instalador y prueba Windows.' >&2
            exit 1
          fi
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'has_installer=%s\n' "$HAS_INSTALLER_BUILDER" >> "$GITHUB_OUTPUT"
      - name: Comprobar el commit y el único cambio autorizado del workflow
        env:
          PUBLISHER_COMMIT: ${{ github.workflow_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python - <<'PY'
          import os
          from publish_release import run

          expected_commit = os.environ['VERIFIED_SOURCE_SHA']
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('Esta publicación debe ejecutarse desde main.')
          if os.environ['RELEASE_REPOSITORY'] != 'jmdiez2026/HidroCAUMAX':
              raise RuntimeError('La publicación preparada pertenece a otro repositorio.')
          if run(['git', 'rev-parse', 'HEAD']).stdout.strip() != expected_commit:
              raise RuntimeError('El checkout no coincide con el código verificado.')
          workflow_commit = os.environ['PUBLISHER_COMMIT']
          run(['git', 'merge-base', '--is-ancestor', expected_commit, workflow_commit])
          changed = run(['git', 'diff', '--name-only', expected_commit, workflow_commit]).stdout.splitlines()
          if changed != ['.github/workflows/publish-1.2.13.yml']:
              raise RuntimeError('La preparación de publicación modifica archivos fuera del workflow.')
          PY
      - name: Preparar compilador y extractor del instalador Windows
        if: steps.source.outputs.has_installer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nsis p7zip-full
      - name: Validar el instalador Windows
        if: steps.source.outputs.has_installer == 'true'
        run: python -m unittest discover -s tests -p test_windows_installer.py -v
      - name: Validar empaquetado, identidad y XML
        run: python -m unittest discover -s tests -p test_release_packaging.py -v
      - name: Validar empaquetador del runtime TauDEM
        run: python -m unittest discover -s tests -p test_taudem_bundle.py -v
      - name: Verificar integridad del runtime TauDEM versionado
        run: python scripts/prepare_taudem_bundle.py --verify src/caumax_consulta/vendor/taudem-5.5.0-win64.zip
      - name: Construir ZIP reproducible
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_release.py --output dist --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Construir una vez e incorporar el instalador Windows
        if: steps.source.outputs.has_installer == 'true'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          BUNDLE_PACKAGE="$(python -c "import json; print(json.load(open('dist/release_manifest.json'))['package'])")"
          BUNDLE_INSTALLER="${BUNDLE_PACKAGE%.zip}_Setup.exe"
          python scripts/build_windows_installer.py --zip "dist/$BUNDLE_PACKAGE" --manifest dist/release_manifest.json --output-dir dist
          python scripts/build_release.py --output dist --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --reuse-zip "dist/$BUNDLE_PACKAGE" --installer "dist/$BUNDLE_INSTALLER" --installer-manifest dist/installer_manifest.json
      - name: Verificar el conjunto completo antes de conservarlo
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/publish_release.py --output dist --repository "$RELEASE_REPOSITORY" --dry-run
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('dist/release_manifest.json').read_text(encoding='utf-8'))
          if manifest['sha256'] != os.environ['VERIFIED_ZIP_DIGEST']:
              raise RuntimeError('El instalable no coincide con el ZIP verificado.')
          if manifest['tag'] != 'v1.2.13' or manifest['version'] != '1.2.13':
              raise RuntimeError('La versión no coincide con la publicación preparada.')
          if not manifest.get('windows_installer'):
              raise RuntimeError('Esta publicación requiere su instalador Windows.')
          PY
      - name: Conservar el mismo bundle para Windows, publicación y reintentos
        uses: actions/upload-artifact@v4
        with:
          name: hidrocaumax-release-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          overwrite: false

  windows-smoke:
    needs: build
    if: needs.build.outputs.has_installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      installer_sha256: ${{ steps.smoke.outputs.installer_sha256 }}
      zip_sha256: ${{ steps.smoke.outputs.zip_sha256 }}
    steps:
      - name: Obtener la misma revisión fuente del bundle
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false
      - name: Descargar el EXE original sin recompilar
        uses: actions/download-artifact@v4
        with:
          name: hidrocaumax-release-bundle-${{ github.run_id }}
          path: dist
      - name: Probar instalación, actualización y desinstalación reales
        id: smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tests/windows_installer_smoke.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $manifest = Get-Content -LiteralPath 'dist/release_manifest.json' -Raw | ConvertFrom-Json
          $installer = Join-Path $PWD (Join-Path 'dist' $manifest.windows_installer.package)
          $zip = Join-Path $PWD (Join-Path 'dist' $manifest.package)
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $manifest.windows_installer.sha256 -or
              (Get-Item -LiteralPath $installer).Length -ne $manifest.windows_installer.bytes -or
              $zipHash -ne $manifest.sha256 -or (Get-Item -LiteralPath $zip).Length -ne $manifest.bytes) {
            throw 'El artefacto descargado no coincide con el manifiesto verificado.'
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'hidrocaumax-windows-smoke/windows_installer_smoke.json'
          & pwsh -NoProfile -File tests/windows_installer_smoke.ps1 -InstallerPath $installer -ZipPath $zip -ReportPath $reportPath -TimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) { throw 'La prueba real del instalador Windows ha fallado.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.success -or -not $report.windows_executed -or
              $report.installer_sha256 -ne $installerHash -or $report.zip_sha256 -ne $zipHash) {
            throw 'El informe Windows no confirma la ejecución correcta de estos archivos.'
          }
          "installer_sha256=$installerHash" >> $env:GITHUB_OUTPUT
          "zip_sha256=$zipHash" >> $env:GITHUB_OUTPUT
      - name: Conservar siempre el informe y el registro Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidrocaumax-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hidrocaumax-windows-smoke/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [build, windows-smoke]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.windows-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener la revisión publicadora verificada de main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preparar el extractor para verificar el EXE ya probado
        if: needs.build.outputs.has_installer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y p7zip-full
      - name: Descargar el mismo bundle inmutable de este run
        uses: actions/download-artifact@v4
        with:
          name: hidrocaumax-release-bundle-${{ github.run_id }}
          path: dist
      - name: Cotejar los archivos con la prueba Windows y la etiqueta solicitada
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          HAS_INSTALLER: ${{ needs.build.outputs.has_installer }}
          WINDOWS_EXE_SHA256: ${{ needs.windows-smoke.outputs.installer_sha256 }}
          WINDOWS_ZIP_SHA256: ${{ needs.windows-smoke.outputs.zip_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          folder = Path('dist')
          manifest = json.loads((folder / 'release_manifest.json').read_text(encoding='utf-8'))
          if manifest['tag'] != os.environ['RELEASE_TAG']:
              raise RuntimeError('El bundle pertenece a otra etiqueta.')
          windows = manifest.get('windows_installer')
          if bool(windows) != (os.environ['HAS_INSTALLER'] == 'true'):
              raise RuntimeError('La modalidad de publicación ha cambiado después de construir el bundle.')
          if windows:
              for name, recorded, tested in (
                  (windows['package'], windows['sha256'], os.environ['WINDOWS_EXE_SHA256']),
                  (manifest['package'], manifest['sha256'], os.environ['WINDOWS_ZIP_SHA256']),
              ):
                  if not tested or recorded != tested or hashlib.sha256((folder / name).read_bytes()).hexdigest() != tested:
                      raise RuntimeError('La publicación no contiene exactamente los archivos probados en Windows.')
          PY
      - name: Crear o verificar la etiqueta de la versión probada
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISHER_COMMIT: ${{ github.workflow_sha }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python - <<'PY'
          import os
          from pathlib import Path
          from publish_release import api, run, validate_bundle

          repository = os.environ['RELEASE_REPOSITORY']
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('Esta publicación debe ejecutarse desde main.')
          expected_commit = os.environ['VERIFIED_SOURCE_SHA']
          expected_tag = 'v1.2.13'
          expected_digest = os.environ['VERIFIED_ZIP_DIGEST']
          if repository != 'jmdiez2026/HidroCAUMAX':
              raise RuntimeError('La publicación preparada pertenece a otro repositorio.')
          workflow_commit = os.environ['PUBLISHER_COMMIT']
          if workflow_commit != os.environ['GITHUB_SHA']:
              raise RuntimeError('La revisión publicadora no coincide con el push ejecutado.')
          if run(['git', 'rev-parse', 'HEAD']).stdout.strip() != workflow_commit:
              raise RuntimeError('El checkout no coincide con la revisión publicadora verificada.')
          run(['git', 'merge-base', '--is-ancestor', expected_commit, workflow_commit])
          changed = run(['git', 'diff', '--name-only', expected_commit, workflow_commit]).stdout.splitlines()
          if changed != ['.github/workflows/publish-1.2.13.yml']:
              raise RuntimeError('La preparación de publicación modifica archivos fuera del workflow.')
          manifest, _ = validate_bundle(Path('dist'), repository)
          if manifest['tag'] != expected_tag or manifest['version'] != '1.2.13':
              raise RuntimeError('La versión no coincide con la publicación preparada.')
          if manifest['sha256'] != expected_digest:
              raise RuntimeError('El instalable no coincide con el ZIP verificado.')
          if not manifest.get('windows_installer'):
              raise RuntimeError('Esta publicación requiere el instalador probado en Windows.')
          endpoint = f'repos/{repository}/git/ref/tags/{expected_tag}'
          reference = api(endpoint, missing_ok=True)
          if reference is None:
              # Tag the current verified main commit with the existing contents
              # permission. Its only difference from the tested source is this
              # publisher workflow; no product/build/test file may differ.
              branch = api(f'repos/{repository}/git/ref/heads/main')['object']
              if branch['type'] != 'commit' or branch['sha'] != workflow_commit:
                  raise RuntimeError('main ha avanzado; no se etiqueta una revisión distinta.')
              run(['gh', 'api', '--method', 'POST', f'repos/{repository}/git/refs',
                   '-f', f'ref=refs/tags/{expected_tag}', '-f', f'sha={workflow_commit}'])
              reference = api(endpoint)
          target = reference['object']
          while target['type'] == 'tag':
              target = api(f'repos/{repository}/git/tags/{target["sha"]}')['object']
          if target['type'] != 'commit' or target['sha'] != workflow_commit:
              raise RuntimeError('La etiqueta existente apunta a otro commit; no se sustituye.')
          print('Etiqueta, ZIP e instalador Windows verificados para HidroCAUMAX 1.2.13.')
          PY
      - name: Preparar publicador de la revisión del workflow
        env:
          PUBLISHER_COMMIT: ${{ github.workflow_sha }}
        run: |
          # El complemento y build_release siguen siendo los de la fuente fijada.
          # El publicador corregido permite completar publicaciones existentes.
          git show "$PUBLISHER_COMMIT:scripts/publish_release.py" > "$RUNNER_TEMP/hidrocaumax-publish-release.py"
      - name: Crear o completar Release sin sustituir archivos existentes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/scripts" python "$RUNNER_TEMP/hidrocaumax-publish-release.py" --output dist --repository "$RELEASE_REPOSITORY"
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir índice QGIS
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar disponibilidad del índice QGIS
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Pages espera el artefacto de este intento. El ZIP y el EXE siguen
          # siendo los del bundle original, incluso al reintentar solo publish.
          for attempt in {1..12}; do
            count=$(gh api "repos/$PAGES_REPOSITORY/actions/runs/$PAGES_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "El índice QGIS de este intento está duplicado; se detiene el despliegue." >&2
              exit 1
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "El índice QGIS no está disponible en la API tras la espera; se puede reintentar." >&2
          exit 1
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
